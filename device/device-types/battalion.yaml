id: battalion
name: Unfiltered Audio Battalion (AUv3)
manufacturer: Unfiltered Audio
description: >
  Battalion's own MIDI layout: a drum machine of eight voices that listens on
  fixed channels. Channel 1 triggers the voices (C to G of any octave),
  channels 2 to 9 play one voice each chromatically (note 60 is the voice's own
  pitch), channel 10 runs its sequencer and mixer, channel 11 its presets and
  randomisers. Nothing in the plugin remaps this, so every control here
  carries its own channel and the device's channel is not used. A control's
  value is the note's velocity; the triggers need no note-off. Checked on an
  iPad with version 1.2.0: the voices, the chromatic channels 2 and 3, the
  sequencer's toggle, play and stop, a voice's mute and the preset steps; the
  rest is from the manual (pp. 76-78). The plugin has no CC map: its
  parameters (3225 of them) move only through mappings the host makes, and a
  session authored or imported for it yields those as controls of their own.
  Manual: https://files.plugin-alliance.com/products/unfiltered_audio_battalion/unfiltered_audio_battalion_manual.pdf
transport: auv3midi
settle_ms: 0
controls:
  - name: voice_1
    description: "Trigger voice 1 at its own pitch (channel 1, note 36; the same pad repeats in every octave)"
    type: note_on
    cc: 36
    channel: 1
    value: { type: range, min: 1, max: 127 }
  - name: voice_2
    description: "Trigger voice 2 at its own pitch (channel 1, note 37; the same pad repeats in every octave)"
    type: note_on
